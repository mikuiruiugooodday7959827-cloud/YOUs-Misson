function selfOk(ok){mark(!ok);fb(ok?'ok':'no',ok?'せいかい！✨':'だいじょうぶ！あとで もう1回 やろう')}
function gr(n){S.g=[n];save();home()}
function home(){stats();$('v').innerHTML=`<h1>きょうのミッション</h1><div class="gr">${[2,3,4].map(n=>`<button class="${S.g[0]==n?'gold':''}" onclick="gr(${n})">${n}年</button>`).join('')}</div><div class="gr">${[['c','漢字：えらぶ'],['w','漢字：かく']].map(([k,t])=>`<button class="${(S.m||'c')==k?'gold':''}" onclick="md('${k}')">${t}</button>`).join('')}</div><p class="c mute">どっちから はじめる？</p>
<button class="big win k" onclick="go('kanji')"><span class="ic">📖</span><span>${NM.kanji}<small>${S.n}もん</small></span></button>
<button class="big win m" onclick="go('math')"><span class="ic">🧮</span><span>${NM.math}<small>${S.n}もん・かいて とく</small></span></button><div class="two"><button class="gold" onclick="shop()">🎁 ごほうび</button><button style="background:#ffd400" onclick="zukan()">📖 ずかん ${CH.filter((_,i)=>S.cards[i]).length}/${CH.length}</button></div>`}
function go(s){
 if(!S.start||S.end){S.start=new Date().toISOString();S.end=null;save()}
 const r=S.retry.find(x=>x.s==s);let ids=r?[r.i]:[];
 const rest=sh((s=='math'?[...Q.math.keys()]:allow()).filter(i=>!ids.includes(i)));
 R={s,items:ids.concat(rest).slice(0,S.n),k:0};ask()}
function ask(){
 if(R.s=='kanji'&&S.m=='w')return askWrite(R.items[R.k]);const it=R.cur=itm(R.s,R.items[R.k]);if(R.s=='math')return askMath(it);R.opts=sh([it.a,...it.w]);
 const d=R.items.map((_,j)=>`<i class="${j<R.k?'on':''}"></i>`).join('');
 $('v').innerHTML=`<div class="dots">${d}</div><p class="c mute">${NM[R.s]}</p>
<div class="win q">${fr(it.q)}${it.p?`<p class="mute" style="margin-top:8px">${it.p}</p>`:''}</div>
<div class="opts">${R.opts.map((o,j)=>`<button onclick="pick(${j})">${R.s=='math'?fr(o):o}</button>`).join('')}</div>
<button class="ghost" onclick="skip()">わからない（しるしをつける）</button>
<button class="ghost" onclick="rest()">ひと休み</button>`}
function mark(add){const i=R.items[R.k];const has=S.retry.some(x=>x.s==R.s&&x.i==i);
 if(add&&!has)S.retry.push({s:R.s,i});if(!add)S.retry=S.retry.filter(x=>!(x.s==R.s&&x.i==i));S.blocks++;S.pt++;save();stats()}
function fb(cls,t,ans){const last=R.k==R.items.length-1;
 $('v').innerHTML=`<div class="win ${cls} msg">${t}${ans?`<p style="margin-top:8px">こたえ：${R.s=='math'?fr(ans):ans}</p>`:''}<p class="mute" style="margin-top:6px">⭐ ポイント +1</p></div>
<button class="gold" onclick="next()">${last?'ミッション かんりょう！':'つぎへ'}</button>`}
function pick(j){const it=R.cur;
 if(R.opts[j]==it.a){mark(false);fb('ok','せいかい！✨')}
 else{mark(true);fb('no','おしい！あとで もう1回 やろう',it.a)}}
function askMath(it){
 const d=R.items.map((_,j)=>`<i class="${j<R.k?'on':''}"></i>`).join('');
 const f=n=>`<span class="fi"><input id="n${n}" inputmode="numeric" aria-label="ぶんし${n}"><hr><input id="d${n}" inputmode="numeric" aria-label="ぶんぼ${n}"></span>`;
 $('v').innerHTML=`<div class="dots">${d}</div><p class="c mute">${NM.math}</p>
<div class="win q" style="padding:12px">${fr(it.q)}</div>
<div class="padw"><span>ここに かいて かんがえよう</span><canvas id="pad"></canvas></div>
<div class="ans">${f(1)}<span>と</span>${f(2)}</div><p class="hint c mute"></p>
<button class="gold" onclick="chk()">こたえあわせ</button>
<div class="row"><button class="ghost" onclick="padClear()">けしゴム</button><button class="ghost" onclick="skip()">わからない</button><button class="ghost" onclick="rest()">ひと休み</button></div>`;
 const c=$('pad'),dpr=window.devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
 const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#222';
 let on=false;
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(e.offsetX,e.offsetY);x.lineTo(e.offsetX+.1,e.offsetY);x.stroke()};
 c.onpointermove=e=>{if(on){x.lineTo(e.offsetX,e.offsetY);x.stroke()}};
 c.onpointerup=c.onpointercancel=()=>{on=false};
 R.pad=()=>x.clearRect(0,0,c.width,c.height)}
function padClear(){R.pad&&R.pad()}
function chk(){const it=Q.math[R.items[R.k]];
 const v=['n1','d1','n2','d2'].map(i=>parseInt($(i).value,10));
 if(v.some(isNaN)){document.querySelector('.hint').textContent='4つの マスに すうじを いれてね';return}
 const [a,b,c,d]=it.q.match(/(\d+)\/(\d+) と (\d+)\/(\d+)/).slice(1).map(Number),[n1,d1,n2,d2]=v;
 const g=(p,q)=>q?g(q,p%q):p,l=b*d/g(b,d);
 const ok=d1>0&&d1==d2&&n1*b==a*d1&&n2*d==c*d2;
 if(ok){mark(false);fb('ok',d1==l?'せいかい！✨':`せいかい！✨<br><span class="mute">いちばん小さい ぶんぼは ${l} だよ</span>`)}
 else{mark(true);fb('no','おしい！あとで もう1回 やろう',it.a)}}
function skip(){const it=R.cur;mark(true);fb('ok','しるしを つけたよ。ここまで来たのが すごい！',it.a)}
function next(){R.k++;R.k<R.items.length?ask():clear_()}
function rest(){$('v').innerHTML=`<h1>ひと休み</h1><p class="c">のんびり してね。じゅんびが できたら もどろう。</p><button class="gold" onclick="ask()">もどる</button>`}
const CH=[
{e:'🐺',n:'フェンリル',o:'北欧',f:'かみさまを のみこむ ほくおうの おおかみ',r:0},
{e:'🐍',n:'ヨルムンガンド',o:'北欧',f:'せかいを ぐるっと とりまく おおへび',r:0},
{e:'🦊',n:'きゅうびのきつね',o:'日本',f:'しっぽが 9ほんある ばけぎつね',r:0},
{e:'👹',n:'あかおに',o:'日本',f:'こんぼうを もつ ちからもちの おに',r:0},
{e:'🦅',n:'ホルス',o:'エジプト',f:'そらを まもる ハヤブサの かみさま',r:0},
{e:'🦂',n:'セルケト',o:'エジプト',f:'どくから まもる サソリの めがみ',r:0},
{e:'🧌',n:'トロール',o:'北欧',f:'やまに すむ おおきな ようかい',r:0},
{e:'🧞',n:'ジン',o:'アラビア',f:'アラビアの まほうの せいれい',r:0},
{e:'🐢',n:'げんぶ',o:'中国',f:'かめと へびが あわさった きたの まもりがみ',r:1},
{e:'🐯',n:'びゃっこ',o:'中国',f:'にしを まもる しろい とら',r:1},
{e:'🐴',n:'ペガサス',o:'ギリシャ',f:'つばさの はえた でんせつの うま',r:1},
{e:'🔱',n:'ポセイドン',o:'ギリシャ',f:'うみを おさめる かみさま',r:1},
{e:'🗡️',n:'エクスカリバー',o:'イギリス',f:'アーサーおうが もつ でんせつの けん',r:1},
{e:'🐉',n:'ヤマタノオロチ',o:'日本',f:'あたまが 8つある にほんの おおへび',r:2},
{e:'⚡',n:'ゼウス',o:'ギリシャ',f:'かみなりを つかう かみさまの おう',r:2},
{e:'☀️',n:'アマテラス',o:'日本',f:'たいように つながる にほんの かみさま',r:2}];
const RN=['ふつう','レア','スーパーレア'];
function chestOK(){const d=new Date().toLocaleDateString('sv');if(!S.cd||S.cd.d!=d)S.cd={d,n:0};return S.cd.n<3}
function clear_(){S.end=new Date().toISOString();save();stats();
 if(chestOK())scr(`<div class="gem">🎁</div><h1>たからばこ！</h1><p class="c">さいくつ かんりょう！ ⭐ +${R.items.length}</p><button class="gold" onclick="openC()">あける</button>`);
 else done(`<div class="gem">💎</div><h1>さいくつ かんりょう！</h1><p class="c">⭐ ポイント +${R.items.length} ゲット！</p><p class="c mute">きょうの たからばこは おしまい。また あした！</p>`)}
function openC(){if(!chestOK())return home();S.cd.n++;
 const r=Math.random()*100,rar=r<5?2:r<30?1:0,pool=CH.map((_,i)=>i).filter(i=>CH[i].r==rar),id=pool[Math.floor(Math.random()*pool.length)];
 const had=S.cards[id]||0;S.cards[id]=had+1;save();const c=CH[id],lv=Math.min(5,S.cards[id]);
 done(`<div class="gem" style="font-size:30px">✨</div><div class="win msg cd r${c.r}"><div class="em">${c.e}</div>${c.n}<p class="mute">${c.o}・${RN[c.r]}</p><p style="font-size:16px;margin-top:4px">${c.f}</p><p class="mute" style="margin-top:4px">${had?'なかよしLv '+lv+(lv>=5?'（MAX）':''):'あたらしい なかま！'}</p></div>`)}
function done(h){const other=R.s=='kanji'?'math':'kanji';
 scr(h+`<button onclick="go('${R.s}')">もう1セット</button><button onclick="go('${other}')">${NM[other]}へ</button><button class="ghost" onclick="home()">きょうは ここまで</button>`)}
function zd(i){const c=CH[i];
 scr(`<div class="win msg cd r${c.r}"><div class="em">${c.e}</div>${c.n}<p class="mute">${c.o}・${RN[c.r]}</p><p style="font-size:16px;margin-top:4px">${c.f}</p><p class="mute" style="margin-top:4px">なかよしLv ${Math.min(5,S.cards[i])}</p></div><button onclick="zukan()">もどる</button>`)}
function zukan(){const n=CH.filter((_,i)=>S.cards[i]).length;
 scr(`<h1>ずかん</h1><p class="c">${n} / ${CH.length} あつめた</p><div class="sl"><div class="zg">${CH.map((c,i)=>S.cards[i]?`<div class="zc r${c.r}" onclick="zd(${i})"><b>${c.e}</b><span>${c.n}</span><small>Lv ${Math.min(5,S.cards[i])}</small></div>`:`<div class="zc q0"><b>？</b><span>？？？</span></div>`).join('')}</div></div><button onclick="home()">もどる</button>`)}
function scr(h){$('v').innerHTML='<div class="scr">'+h+'</div>'}
function shop(){
 const rows=S.prizes.map((p,j)=>`<div class="win prz"><span>${esc(p.n)}<small>${p.c}ポイント</small></span>${S.pt>=p.c?`<button class="gold" onclick="ex(${j})">こうかん</button>`:`<button disabled>あと ${p.c-S.pt}</button>`}</div>`).join('')||'<p class="c mute">ごほうびは おうちの人が きめるよ</p>';
 scr(`<h1>ごほうび</h1><p class="c">⭐ ${S.pt} ポイント</p><div class="sl">${rows}</div><button onclick="home()">もどる</button>`)}
function ex(j){const p=S.prizes[j];if(!p||S.pt<p.c)return shop();
 scr(`<div class="win msg">🎁 ${esc(p.n)}<p class="mute" style="margin-top:6px">${p.c}ポイントと こうかん</p><p style="margin-top:8px;font-size:16px">おうちの人と いっしょに おしてね</p></div><button class="gold" onclick="doEx(${j})">こうかんする</button><button class="ghost" onclick="shop()">やめる</button>`)}
function doEx(j){const p=S.prizes[j];if(!p||S.pt<p.c)return shop();
 S.pt-=p.c;S.log.push({n:p.n,c:p.c,t:new Date().toISOString(),d:false});save();stats();
 scr(`<div class="gem">🎫</div><h1>こうかん ずみ！</h1><div class="win msg">${esc(p.n)}<p class="mute" style="margin-top:6px">おうちの人に みせてね</p></div><button onclick="shop()">もどる</button>`)}
let KP={buf:'',mode:'',first:''};
const hp=p=>{let h=7;for(const c of p)h=(h*31+c.charCodeAt(0))%1000003;return 'h'+h};
function lock(){KP={buf:'',mode:S.pin?'in':'new',first:''};kp()}
function chPin(){KP={buf:'',mode:'new',first:''};kp()}
function kp(msg){
 const t={in:'あんしょうばんごうを いれてね',new:'あたらしい 4けたの あんしょうばんごうを きめてね',again:'もういちど おなじ ばんごうを いれてね'}[KP.mode];
 scr(`<h1>おうちの人</h1><p class="c">${msg||t}</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<KP.buf.length?'on':''}"></i>`).join('')}</div><div class="kpd">${[1,2,3,4,5,6,7,8,9,'⌫',0,'×'].map(k=>`<button onclick="kk('${k}')">${k}</button>`).join('')}</div>`)}
function kk(k){
 if(k=='×')return home();
 if(k=='⌫'){KP.buf=KP.buf.slice(0,-1);return kp()}
 if(KP.buf.length>=4)return;KP.buf+=k;
 if(KP.buf.length<4)return kp();
 const b=KP.buf;KP.buf='';
 if(KP.mode=='in'){if(S.pin==hp(b))return parent_();return kp('ちがうよ。もういちど')}
 if(KP.mode=='new'){KP.first=b;KP.mode='again';return kp()}
 if(b==KP.first){S.pin=hp(b);save();parent_()}else{KP.mode='new';kp('ばんごうが ちがうよ。さいしょから')}}
function sn(n){S.n=n;save();parent_()}
function dn(j){S.log[j].d=!S.log[j].d;save();parent_()}
function dpAsk(){scr(`<div class="win msg">ごほうびを ぜんぶ けす？<p class="mute" style="margin-top:6px">もとには もどせないよ</p></div><button class="gold" onclick="dpAll()">ぜんぶ けす</button><button class="ghost" onclick="parent_()">やめる</button>`)}
function dpAll(){S.prizes=[];save();parent_()}
function dp(j){S.prizes.splice(j,1);save();parent_()}
function ap(){const n=$('pn').value.trim(),c=parseInt($('pc').value,10);if(!n||!(c>0))return;S.prizes.push({n,c});S.prizes.sort((a,b)=>a.c-b.c);save();parent_()}
function parent_(){
 const l=S.retry.map(x=>'・'+itm(x.s,x.i).q.replace(/<[^>]+>/g,'')+'（'+NM[x.s]+'）').join('<br>')||'なし';
 const lg=S.log.map((g,j)=>`<div class="prz"><span>${hm(g.t)} ${esc(g.n)}<small>${g.c}ポイント</small></span><button class="${g.d?'':'gold'}" onclick="dn(${j})">${g.d?'わたした✓':'わたした？'}</button></div>`).reverse().join('')||'なし';
 const pz=S.prizes.map((p,j)=>`<div class="prz"><span>${esc(p.n)}<small>${p.c}ポイント</small></span><button class="ghost" onclick="dp(${j})">けす</button></div>`).join('')||'<p class="mute">まだ ないよ。したから ついかしてね</p>';
 scr(`<div class="sl"><div class="win"><p>はじめた：${hm(S.start)}</p><p>おわった：${S.end?hm(S.end):'まだ'}</p><p>ポイント：⭐ ${S.pt}</p></div>
<div class="win"><p class="mute">こうかんの きろく</p>${lg}</div>
<div class="win"><p class="mute">ごほうびを きめる</p>${pz}${S.prizes.length?'<button class="ghost" onclick="dpAsk()" style="margin-top:6px">ぜんぶ けす</button>':''}<div class="prz" style="margin-top:8px"><input id="pn" class="in" placeholder="なまえ" style="flex:1"><input id="pc" class="in" inputmode="numeric" placeholder="pt" style="width:70px"><button class="gold" onclick="ap()">ついか</button></div></div>
<div class="win"><p class="mute">1セットの もんだい数</p><div class="two">${[3,5,7].map(n=>`<button class="${S.n==n?'gold':''}" onclick="sn(${n})">${n}もん</button>`).join('')}</div></div>
<div class="win"><p class="mute">あとで一緒にみる問題</p><div class="list">${l}</div></div><button class="ghost" onclick="chPin()">あんしょうばんごうを かえる</button></div><button onclick="home()">もどる</button>`)}
home();
</script></body></html>
